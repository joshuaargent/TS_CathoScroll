<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CathoScroll</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        align-items: center;
        justify-content: center;
        background: #faf7f2;
        color: #24211f;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .logo {
        width: 7rem;
        height: 7rem;
        border-radius: 1.5rem;
        box-shadow: 0 1rem 2.5rem rgb(63 31 130 / 18%);
      }
      .app-name {
        font-size: 1.25rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="logo.png" alt="" />
    <div class="app-name">CathoScroll</div>
  </body>
</html>
