name: CathoScroll Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example v2.2.0)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: cathoscroll-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate source, tests and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run type-check

  build-desktop:
    name: Build ${{ matrix.name }}
    needs: validate-source
    strategy:
      fail-fast: false
      # Platform jobs only build; the final job publishes all assets together.
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            platform: win
            architecture: x64
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            architecture: x64
          - name: macOS Universal
            runner: macos-26
            platform: mac
            architecture: universal

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify release versions
        shell: bash
        run: |
          node <<'NODE'
          const root = require('./package.json');
          const electron = require('./electron/package.json');
          const tagVersion = process.env.RELEASE_TAG.replace(/^v/, '');

          if (!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(tagVersion)) {
            throw new Error(`Invalid release tag: ${process.env.RELEASE_TAG}`);
          }
          if (root.version !== tagVersion || electron.version !== tagVersion) {
            throw new Error(
              `Release version mismatch: tag=${tagVersion}, root=${root.version}, electron=${electron.version}`
            );
          }
          console.log(`Building CathoScroll ${tagVersion}`);
          NODE

      - name: Install project dependencies
        run: npm ci

      - name: Build native app and export offline catalogue
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run cap:sync:electron

      - name: Create macOS application icon
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          iconset="electron/assets/icon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -s format png -z "$size" "$size" assets/logo.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -s format png -z "$double" "$double" assets/logo.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o electron/assets/icon.icns
          test -s electron/assets/icon.icns
          rm -rf "$iconset"

      - name: Package desktop application without publishing
        run: npm --prefix electron run pack -- --${{ matrix.platform }} --${{ matrix.architecture }} --publish never

      - name: Upload platform build outputs for verification
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: electron/dist/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build signed Android APK
    needs: validate-source
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Validate release configuration
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Missing NEXT_PUBLIC_SUPABASE_URL Actions variable"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY Actions variable"; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 Actions secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD Actions secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS Actions secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD Actions secret"; exit 1; }

      - name: Derive Android version code from release version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          IFS=. read -r major minor patch <<< "$version"
          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ || "$minor" -gt 999 || "$patch" -gt 999 ]]; then
            echo "Release version cannot be converted to an Android version code: $version"
            exit 1
          fi
          android_version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( android_version_code < 1 || android_version_code > 2100000000 )); then
            echo "Android version code is outside the supported range: $android_version_code"
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=$android_version_code" >> "$GITHUB_ENV"

      - name: Install project dependencies
        run: npm ci

      - name: Build Android web assets and sync native project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CATHOSCROLL_VERSION: ${{ env.RELEASE_TAG }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
        run: |
          npm run native:build
          npx cap sync android

      - name: Restore Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cathoscroll-release.jks
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cathoscroll-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CATHOSCROLL_VERSION: ${{ env.RELEASE_TAG }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: bash ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Verify APK output and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/CathoScroll-${RELEASE_TAG#v}.apk"
          test -s "$apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: Android APK
          path: android/app/build/outputs/apk/release/CathoScroll-*.apk
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Finalise GitHub Release
    needs:
      - build-desktop
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform build outputs
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify local release outputs
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name 'CathoScroll-*.apk' -print -quit)"

      - name: Upload all assets, verify the release, and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          # electron-builder no longer publishes per-platform. Create the draft
          # once, then upload the complete, verified set from this single job.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "CathoScroll $RELEASE_TAG" --generate-notes
          fi

          gh release upload "$RELEASE_TAG" \
            release-assets/CathoScroll-* \
            release-assets/latest.yml \
            release-assets/latest-linux.yml \
            release-assets/latest-mac.yml \
            --clobber

          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$assets"

          expected_assets=(
            "CathoScroll-$version-x64.exe"
            "CathoScroll-$version-x86_64.AppImage"
            "CathoScroll-$version-amd64.deb"
            "CathoScroll-$version-universal.dmg"
            "CathoScroll-$version-universal.zip"
            "CathoScroll-$version.apk"
            "latest.yml"
            "latest-linux.yml"
            "latest-mac.yml"
          )

          for expected in "${expected_assets[@]}"; do
            if ! grep -Fxq "$expected" <<<"$assets"; then
              echo "Missing published release asset: $expected"
              exit 1
            fi
          done

          gh release edit "$RELEASE_TAG" --draft=false --title "CathoScroll $RELEASE_TAG"
