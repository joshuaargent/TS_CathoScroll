name: CathoScroll Release Build Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cathoscroll-release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Validate ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: win
            architecture: x64
            extension: exe
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            architecture: x64
            extension: AppImage
          - name: macOS Intel
            runner: macos-26-intel
            platform: mac
            architecture: x64
            extension: dmg
          - name: macOS Apple Silicon
            runner: macos-26
            platform: mac
            architecture: arm64
            extension: dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build native app and export offline catalogue
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run cap:sync:electron

      - name: Create macOS application icon
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p electron/assets/iconset
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$size" "$size" assets/logo.png --out "electron/assets/iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$double" "$double" assets/logo.png --out "electron/assets/iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns electron/assets/iconset -o electron/assets/icon.icns
          rm -rf electron/assets/iconset

      - name: Package desktop application without publishing
        run: npm --prefix electron run pack -- --${{ matrix.platform }} --${{ matrix.architecture }} --publish never

      - name: Verify installer output
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find electron/dist -maxdepth 1 -type f -name '*.${{ matrix.extension }}' -print -quit)"

  build-android:
    name: Validate Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm ci

      - name: Build Android web assets and sync native project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run native:build
          npx cap sync android

      - name: Build unsigned release APK for compile validation
        working-directory: android
        run: bash ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name 'CathoScroll-*.apk' -print -quit)"
